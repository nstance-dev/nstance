{{- if .Values.registrationSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registrationSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  nonce.jwt: {{ required "registrationSecret.nonceJWT is required when registrationSecret.enabled=true" .Values.registrationSecret.nonceJWT | quote }}
{{- end }}
