# Registration secret is expected to be created manually by the user
# Example:
#   kubectl create secret generic nstance-registration \
#     --namespace nstance-system \
#     --from-literal=nonce=<JWT-from-nstance-server>
#
# The operator will create the following secrets automatically during registration:
#   - {{ .Values.managedSecretNames.privateKey }} (operator private key)
#   - {{ .Values.managedSecretNames.clientCert }} (operator client certificate)
