{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nstance-operator.fullname" . }}
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nstance-operator.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "nstance-operator.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
{{- end }}
