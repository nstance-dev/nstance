{{- if and .Values.deployment.enabled .Values.webhooks.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nstance-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nstance-operator.selectorLabels" . | nindent 4 }}
  ports:
  - name: webhook
    port: 443
    targetPort: webhook
    protocol: TCP
{{- end }}
