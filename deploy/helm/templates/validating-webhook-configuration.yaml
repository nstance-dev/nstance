{{- if and .Values.deployment.enabled .Values.webhooks.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "nstance-operator.fullname" . }}
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "nstance-operator.fullname" . }}-webhook
webhooks:
- name: vnstancemachinepool.infrastructure.cluster.x-k8s.io
  admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "nstance-operator.webhookServiceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /validate-infrastructure-cluster-x-k8s-io-v1beta1-nstancemachinepool
      port: 443
  failurePolicy: {{ .Values.webhooks.failurePolicy }}
  matchPolicy: Equivalent
  rules:
  - apiGroups:
    - infrastructure.cluster.x-k8s.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - nstancemachinepools
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: 10
{{- end }}
