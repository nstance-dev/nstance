{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nstance-capi-workload
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
# CAPI's runningOnWorkloadCluster check GETs its own pod via the kubeconfig
# to detect if management==workload cluster (which it is in our case)
# https://github.com/kubernetes-sigs/cluster-api/blob/main/controllers/clustercache/cluster_accessor_client.go#L145
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- nonResourceURLs:
  - "/"
  verbs:
  - get
{{- end }}
