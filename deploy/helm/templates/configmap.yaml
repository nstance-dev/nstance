{{- if .Values.operatorConfigMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.operatorConfigMap.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    shards:
      {{- range $shard, $config := .Values.config.shards }}
      {{ $shard }}:
        registration_addr: {{ $config.registration_addr | quote }}
        operator_addr: {{ $config.operator_addr | quote }}
      {{- end }}
{{- end }}
