{{- if .Values.operatorConfigMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nstance-operator.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    cluster_id: {{ required "config.clusterID is required" .Values.config.clusterID | quote }}
    tenant: {{ required "config.tenant is required" .Values.config.tenant | quote }}
    sleep:
      enabled: {{ .Values.config.sleep.enabled }}
      remaining_nodes: {{ .Values.config.sleep.remainingNodes }}
      inactivity: {{ .Values.config.sleep.inactivity | quote }}
      activity_windows: {{ .Values.config.sleep.activityWindows | toJson }}
      cron_look_ahead: {{ .Values.config.sleep.cronLookAhead | quote }}
      wake_lead: {{ .Values.config.sleep.wakeLead | quote }}
      reconcile_period: {{ .Values.config.sleep.reconcilePeriod | quote }}
    {{- if not .Values.config.shards }}
    {{- fail "at least one config.shards entry is required" }}
    {{- end }}
    shards:
      {{- range $shard, $config := .Values.config.shards }}
      {{ $shard }}:
        registration_addr: {{ required (printf "config.shards.%s.registration_addr is required" $shard) $config.registration_addr | quote }}
        operator_addr: {{ required (printf "config.shards.%s.operator_addr is required" $shard) $config.operator_addr | quote }}
      {{- end }}
{{- end }}
