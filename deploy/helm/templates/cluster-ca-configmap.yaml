{{- if .Values.clusterCA.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.clusterCA.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nstance-operator.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- required "clusterCA.certificate is required when clusterCA.enabled=true" .Values.clusterCA.certificate | nindent 4 }}
{{- end }}
