syntax = "proto3";

package nstance.v1;

option go_package = "github.com/nstance-dev/nstance/internal/proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// AgentService provides authenticated API for Nstance Agents
service AgentService {
  // ReceiveKeyRequests provides a persistent stream of key generation requests from server to agent
  rpc ReceiveKeyRequests(google.protobuf.Empty) returns (stream KeyGenerationRequest);

  // SubmitPublicKeys allows agents to submit public keys for certificate generation
  rpc SubmitPublicKeys(PublicKeysRequest) returns (google.protobuf.Empty);
  
  // SubmitHealthReport allows agents to send periodic health reports via persistent stream
  rpc SubmitHealthReport(stream HealthReportRequest) returns (google.protobuf.Empty);
  
  // ReceiveFiles provides a persistent stream of files from server to agent (certificates, secrets, config updates)
  rpc ReceiveFiles(google.protobuf.Empty) returns (stream FileTransfer);
}

// Key generation request from server to agent

message KeyGenerationRequest {
  repeated string key_names = 1;
}

// Public keys submission from agent to server

message PublicKeysRequest {
  string instance_id = 1;
  repeated PublicKeySubmission keys = 2;
}

message PublicKeySubmission {
  string filename = 1; // e.g., "kubelet.server"
  bytes public_key_pem = 2; // PEM-encoded public key
}

// Health report from agent to server

message HealthReportRequest {
  string version = 1; // Agent version
  string instance_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  int64 count = 4; // Health report sequence number
  string uptime = 5; // Uptime duration string
  Metrics metrics = 6; // Metrics observed for this report
  map<string, FileStatus> files = 7; // File status map
  TerminationNotice termination_notice = 8; // Optional termination notice for spot instances
  string config_hash = 9; // Runtime config hash from /opt/nstance-agent/identity/config.hash
}

// Metrics observed by the agent for one health report

message Metrics {
  optional double cpu_usage = 1; // CPU usage percentage
  repeated double cpu_core_usage = 2; // Per-core CPU usage percentages
  optional double memory_usage = 3; // Memory usage percentage
  optional InterfaceMetrics network_interface = 4;
  optional string network_interface_error = 5;
  map<uint32, uint64> ebpf_counters = 6; // Active TCP connections keyed by target port
  optional string ebpf_error = 7;
  optional uint64 conntrack_count = 8;
  optional uint64 conntrack_max = 9;
  optional string conntrack_error = 10;
}

// Metrics for one explicitly configured network interface

message InterfaceMetrics {
  string interface_name = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  uint64 rx_packets = 4;
  uint64 tx_packets = 5;
  uint64 rx_drops = 6;
  uint64 tx_drops = 7;
}

message FileStatus {
  oneof status {
    google.protobuf.Timestamp last_modified = 1; // File exists and last modified time
    string error = 2; // Error accessing file
  }
}

message TerminationNotice {
  string action = 1; // Action to take, e.g., "terminate"
  google.protobuf.Timestamp deadline = 2; // Optional termination deadline
}

// File transfer from server to agent

message FileTransfer {
  string filename = 1;
  bytes content = 2;
  google.protobuf.Timestamp last_modified = 3;
  string config_hash = 4; // Optional: updated runtime config hash to write to identity/config.hash
}
