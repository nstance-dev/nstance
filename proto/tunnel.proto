syntax = "proto3";

package nstance.v1;

option go_package = "github.com/nstance-dev/nstance/internal/proto";

// TunnelService lets the local tunnel supervisor follow shard-leader intent.
service TunnelService {
  rpc Manage(stream TunnelStatus) returns (stream TunnelDesiredState);
}

// TunnelDesiredState requests a leased lifecycle state for one tunnel.
message TunnelDesiredState {
  // State is the requested tunnel lifecycle state.
  enum State {
    TUNNEL_DESIRED_STATE_UNSPECIFIED = 0;
    TUNNEL_DESIRED_STATE_RUNNING = 1;
    TUNNEL_DESIRED_STATE_STOPPED = 2;
  }

  string tunnel_name = 1;
  uint64 revision = 2;
  State state = 3;
  uint32 lease_seconds = 4;
}

// TunnelStatus reports a revisioned tunnel lifecycle observation.
message TunnelStatus {
  // State is the observed tunnel lifecycle state.
  enum State {
    TUNNEL_STATUS_STATE_UNSPECIFIED = 0;
    TUNNEL_STATUS_STATE_STARTING = 1;
    TUNNEL_STATUS_STATE_READY = 2;
    TUNNEL_STATUS_STATE_FAILED = 3;
    TUNNEL_STATUS_STATE_STOPPED = 4;
  }

  string tunnel_name = 1;
  uint64 revision = 2;
  State state = 3;
  optional string error = 4;
}
