# Config file for [Air](https://github.com/air-verse/air) in TOML format
# Created using 'air init'

root = "."
testdata_dir = "testdata"
tmp_dir = "temp/air-server"

[build]
args_bin = []
bin = "./bin/nstance-server"
cmd = "go build -o ./bin/nstance-server ./cmd/nstance-server"
delay = 1000
exclude_dir = ["bin", "assets", "temp", "vendor", "testdata"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = "./bin/nstance-server --id dev --storage s3 --bucket dev --shard $NSTANCE_DEV_SHARD --cachedir $NSTANCE_DEV_CACHE_DIR --advertise-host 127.0.0.1 --debug"
include_dir = ["cmd", "internal"]
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = []
kill_delay = 2000
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = ["bash -c 'tmux kill-session -t nstance-$NSTANCE_DEV_SHARD-agents 2>/dev/null || true'"]
pre_cmd = []
rerun = true
rerun_delay = 500
send_interrupt = true
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
