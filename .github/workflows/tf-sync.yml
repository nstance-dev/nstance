# Nstance <https://nstance.dev>
# Copyright The Nstance Authors
# SPDX-License-Identifier: Apache-2.0
#
# This workflow syncs Terraform modules to distribution repos on every push
# to main that touches deploy/tf/ or the module documentation, and publishes
# matching module tags when called by the release workflow.

name: Terraform Module Sync

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/tf/**'
      - 'docs/reference/opentofu-terraform.md'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      source_sha:
        description: Nstance commit to export
        required: true
        type: string
      release_tag:
        description: Module tag to publish without updating distribution main
        required: true
        type: string
    secrets:
      AWS_REPO_DEPLOY_KEY:
        required: true
      GOOGLE_REPO_DEPLOY_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-module-sync-${{ inputs.release_tag || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Resolve symlinks and prepare AWS modules
        run: |
          mkdir -p /tmp/aws/modules
          cp -rL deploy/tf/aws/* /tmp/aws/modules/

          # Copy README without Hugo frontmatter
          sed '1{/^---$/!b};1,/^---$/d' docs/reference/opentofu-terraform.md > /tmp/aws/README.md

          # Copy examples and rewrite relative sources to registry syntax
          mkdir -p /tmp/aws/examples
          cp -rL deploy/tf/examples/aws/* /tmp/aws/examples/
          cp -rL deploy/tf/examples/multi-cloud /tmp/aws/examples/

          # Rewrite relative module sources to registry sources and add version pinning
          find /tmp/aws/examples -name "*.tf" -exec sed -i'' \
            -e 's|source *= *"\.\./\.\./\.\./aws/\([^"]*\)"|source  = "nstance-dev/nstance/aws//modules/\1"|g' \
            -e 's|source *= *"\.\./\.\./aws/\([^"]*\)"|source  = "nstance-dev/nstance/aws//modules/\1"|g' \
            -e 's|source *= *"\.\./\.\./google/\([^"]*\)"|source  = "nstance-dev/nstance/google//modules/\1"|g' \
            -e '/source  *= *"nstance-dev\/nstance\//a\  version = "~> 2.0"' \
            {} \;

          # Verify no symlinks remain
          if find /tmp/aws -type l | grep -q .; then
            echo "Error: Unresolved symlinks in AWS modules"
            find /tmp/aws -type l
            exit 1
          fi

          echo "AWS modules prepared successfully"
          ls -la /tmp/aws/modules/
          ls -la /tmp/aws/examples/

      - name: Resolve symlinks and prepare Google modules
        run: |
          mkdir -p /tmp/google/modules
          cp -rL deploy/tf/google/* /tmp/google/modules/

          # Copy README without Hugo frontmatter
          sed '1{/^---$/!b};1,/^---$/d' docs/reference/opentofu-terraform.md > /tmp/google/README.md

          # Copy examples and rewrite relative sources to registry syntax
          mkdir -p /tmp/google/examples
          cp -rL deploy/tf/examples/google/* /tmp/google/examples/
          cp -rL deploy/tf/examples/multi-cloud /tmp/google/examples/

          # Rewrite relative module sources to registry sources and add version pinning
          find /tmp/google/examples -name "*.tf" -exec sed -i'' \
            -e 's|source *= *"\.\./\.\./\.\./google/\([^"]*\)"|source  = "nstance-dev/nstance/google//modules/\1"|g' \
            -e 's|source *= *"\.\./\.\./google/\([^"]*\)"|source  = "nstance-dev/nstance/google//modules/\1"|g' \
            -e 's|source *= *"\.\./\.\./aws/\([^"]*\)"|source  = "nstance-dev/nstance/aws//modules/\1"|g' \
            -e '/source  *= *"nstance-dev\/nstance\//a\  version = "~> 2.0"' \
            {} \;

          if find /tmp/google -type l | grep -q .; then
            echo "Error: Unresolved symlinks in Google modules"
            find /tmp/google -type l
            exit 1
          fi

          echo "Google modules prepared successfully"
          ls -la /tmp/google/modules/
          ls -la /tmp/google/examples/

      - name: Setup SSH for deploy keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Publish Terraform modules
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_REPO_DEPLOY_KEY }}
          GOOGLE_SSH_KEY: ${{ secrets.GOOGLE_REPO_DEPLOY_KEY }}
        run: |
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          for provider in aws google; do
            if [[ "$provider" == aws ]]; then
              echo "$AWS_SSH_KEY" > ~/.ssh/id_ed25519
            else
              echo "$GOOGLE_SSH_KEY" > ~/.ssh/id_ed25519
            fi
            chmod 600 ~/.ssh/id_ed25519

            repo="terraform-${provider}-nstance"
            git clone --branch main --single-branch --no-tags "git@github.com:nstance-dev/${repo}.git" "/tmp/${provider}-repo"
            rsync -a --delete --exclude .git "/tmp/${provider}/" "/tmp/${provider}-repo/"

            cd "/tmp/${provider}-repo"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .

            if [[ -n "$RELEASE_TAG" ]]; then
              git fetch origin 'refs/tags/*:refs/tags/*'
              if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
                if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{tree}")" != "$(git write-tree)" ]]; then
                  echo "::error::${repo} tag ${RELEASE_TAG} already exists with different contents"
                  exit 1
                fi
                echo "${repo} tag ${RELEASE_TAG} already matches ${SOURCE_SHA}"
                continue
              fi
            elif git diff --cached --quiet; then
              echo "No changes to sync to ${repo}"
              continue
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Sync from nstance-dev/nstance@${SOURCE_SHA::8}"
            fi

            if [[ -n "$RELEASE_TAG" ]]; then
              # Publish the exact release export, never rewind development main.
              git tag -a "$RELEASE_TAG" -m "Terraform modules for nstance-dev/nstance@${SOURCE_SHA}"
              git push origin "refs/tags/${RELEASE_TAG}"
              echo "Published ${repo} tag ${RELEASE_TAG}"
            else
              git push origin main
              echo "Synced ${repo}"
            fi
          done
