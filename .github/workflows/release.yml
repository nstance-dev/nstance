name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Helm chart versions match the Git tag
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          for field in version appVersion; do
            actual=$(awk -v field="$field:" '$1 == field { gsub(/["\047]/, "", $2); print $2 }' deploy/helm/Chart.yaml)
            if [[ "$actual" != "$version" ]]; then
              echo "::error file=deploy/helm/Chart.yaml::$field is '$actual', expected '$version' for tag '$GITHUB_REF_NAME'"
              exit 1
            fi
          done

  goreleaser:
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Install build tools
        uses: jdx/mise-action@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.21.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-images:
    runs-on: ubuntu-latest
    needs: goreleaser
    strategy:
      matrix:
        component:
          - server
          - agent
          - operator
          - admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.component }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/nstance-dev/nstance-${{ matrix.component }}:${{ steps.version.outputs.version }}
            ghcr.io/nstance-dev/nstance-${{ matrix.component }}:latest
