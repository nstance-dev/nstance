apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - bases/infrastructure.cluster.x-k8s.io_nstanceclusters.yaml
  - bases/infrastructure.cluster.x-k8s.io_nstancemachinepools.yaml
  - bases/infrastructure.cluster.x-k8s.io_nstancemachines.yaml
  - bases/infrastructure.cluster.x-k8s.io_nstancemachinetemplates.yaml
  - bases/infrastructure.cluster.x-k8s.io_nstanceshardgroups.yaml

# CAPI contract version labels required for provider discovery.
# Without these, CAPI cannot resolve infrastructureRef references to Nstance CRDs.
labels:
  - pairs:
      cluster.x-k8s.io/v1beta1: v1beta1
      cluster.x-k8s.io/v1beta2: v1beta1
